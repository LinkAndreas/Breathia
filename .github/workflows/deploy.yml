name: Deploy to App Store Connect

on:
  # Every merge into main (a finished release or hotfix) deploys; manual runs stay possible.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never upload two builds at once; a newer run waits for the running one to finish.
concurrency:
  group: deploy-app-store-connect
  cancel-in-progress: false

jobs:
  archive-and-deploy:
    name: Archive and deploy (${{ matrix.platform }})
    # Breathia targets iOS, watchOS and macOS 27, whose SDKs ship with Xcode 27.
    runs-on: [self-hosted, xcode-27]

    # One job per platform, so a failed Mac upload can be re-run without uploading the iOS build
    # again. They run one after the other because both change the runner's keychain search list.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # The iOS app embeds the Watch app and the widgets extension.
          - platform: iOS
            destination: generic/platform=iOS
            code_sign_identity: iPhone Distribution
            export_options: Config/ExportOptions.plist
            package: Breathia.ipa
            altool_type: ios
          # The native Mac app is the Breathia target alone; the Watch app and widgets are iOS-only.
          - platform: macOS
            destination: generic/platform=macOS
            code_sign_identity: Apple Distribution
            export_options: Config/ExportOptions-Mac.plist
            package: Breathia.pkg
            altool_type: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      # A failing test stops the deploy before anything is signed or uploaded.
      - name: Run tests
        if: matrix.platform == 'iOS'
        run: |
          # A throwaway iPhone on the newest iOS runtime, so the tests run whatever simulators the
          # runner has, and on an OS as new as the deployment target.
          read RUNTIME DEVICE_TYPE <<< "$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          runtime = max((r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS"), key=lambda r: [int(p) for p in r["version"].split(".")])
          iphone = [t for t in runtime["supportedDeviceTypes"] if t["productFamily"] == "iPhone"][-1]
          print(runtime["identifier"], iphone["identifier"])')"
          SIMULATOR_ID=$(xcrun simctl create "Deploy Tests" "$DEVICE_TYPE" "$RUNTIME")
          trap 'xcrun simctl delete "$SIMULATOR_ID"' EXIT
          set -o pipefail && xcodebuild test \
            -project Breathia.xcodeproj \
            -scheme "Breathia" \
            -destination "id=$SIMULATOR_ID" | xcbeautify

      - name: Install App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/private_keys/AuthKey_$API_KEY_ID.p8"
          # altool reads the key from this per-job folder, so parallel jobs on the same Mac never share or delete each other's key.
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys" >> "$GITHUB_ENV"

      - name: Install Signing Certificates
        env:
          PLATFORM: ${{ matrix.platform }}
          CODE_SIGN_IDENTITY: ${{ matrix.code_sign_identity }}
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MAC_SIGNING_CERTIFICATE_BASE64 }}
          MAC_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGNING_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Create Keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode a base64 .p12 and import it into the keychain.
          import_certificate() {
            local CERTIFICATE_PATH=$RUNNER_TEMP/$1.p12
            echo -n "$2" | base64 --decode -o "$CERTIFICATE_PATH"
            security import "$CERTIFICATE_PATH" -P "$3" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          }

          if [ "$PLATFORM" = "iOS" ]; then
            import_certificate signing_certificate "$SIGNING_CERTIFICATE_BASE64" "$SIGNING_CERTIFICATE_PASSWORD"
          else
            # The Mac app is signed with an Apple Distribution certificate, the .pkg around it
            # with a Mac Installer Distribution certificate.
            import_certificate mac_signing_certificate "$MAC_SIGNING_CERTIFICATE_BASE64" "$MAC_SIGNING_CERTIFICATE_PASSWORD"
            import_certificate mac_installer_certificate "$MAC_INSTALLER_CERTIFICATE_BASE64" "$MAC_INSTALLER_CERTIFICATE_PASSWORD"
          fi

          # Let codesign use the key without a UI prompt; without this it fails with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # Add the keychain to the search list rather than replacing it: the runner is a regular Mac
          # whose login keychain must stay searchable once the cleanup deletes this one.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Sign with the full name of the certificate imported above. A generic name such as
          # "iPhone Distribution" also matches the Apple Distribution certificate in the runner's
          # login keychain, which the iOS profiles don't include.
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o "\"$CODE_SIGN_IDENTITY: [^\"]*\"" | head -n 1 | tr -d '"')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No \"$CODE_SIGN_IDENTITY\" certificate found in the imported signing certificates."
            exit 1
          fi
          echo "Signing identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # iOS needs one App Store profile per target: the iOS app, the Watch app and the widgets
      # extension. macOS needs a Mac App Store profile for the app alone.
      - name: Install Provisioning Profiles
        env:
          PLATFORM: ${{ matrix.platform }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WATCH_PROVISIONING_PROFILE_BASE64: ${{ secrets.WATCH_PROVISIONING_PROFILE_BASE64 }}
          WIDGETS_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGETS_PROVISIONING_PROFILE_BASE64 }}
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Xcode 16 and later read profiles from UserData; older tools still look in MobileDevice.
          for PROFILES_DIR in ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles ~/Library/MobileDevice/Provisioning\ Profiles; do
            mkdir -p "$PROFILES_DIR"
            if [ "$PLATFORM" = "iOS" ]; then
              echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/breathia.mobileprovision"
              echo -n "$WATCH_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/breathia_watch.mobileprovision"
              echo -n "$WIDGETS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/breathia_widgets.mobileprovision"
            else
              echo -n "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/breathia_mac.provisionprofile"
            fi
          done

      - name: Configure export options
        env:
          EXPORT_OPTIONS: ${{ matrix.export_options }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          WATCH_PROVISIONING_PROFILE_NAME: ${{ secrets.WATCH_PROVISIONING_PROFILE_NAME }}
          WIDGETS_PROVISIONING_PROFILE_NAME: ${{ secrets.WIDGETS_PROVISIONING_PROFILE_NAME }}
          MAC_PROVISIONING_PROFILE_NAME: ${{ secrets.MAC_PROVISIONING_PROFILE_NAME }}
        run: |
          sed -i '' "s|{{TEAM_ID}}|$TEAM_ID|g" "$EXPORT_OPTIONS"
          sed -i '' "s|{{SIGNING_IDENTITY}}|$SIGNING_IDENTITY|g" "$EXPORT_OPTIONS"
          sed -i '' "s|{{BUNDLE_ID_PREFIX}}|$BUNDLE_ID_PREFIX|g" "$EXPORT_OPTIONS"
          sed -i '' "s|{{PROVISIONING_PROFILE_NAME}}|$PROVISIONING_PROFILE_NAME|g" "$EXPORT_OPTIONS"
          sed -i '' "s|{{WATCH_PROVISIONING_PROFILE_NAME}}|$WATCH_PROVISIONING_PROFILE_NAME|g" "$EXPORT_OPTIONS"
          sed -i '' "s|{{WIDGETS_PROVISIONING_PROFILE_NAME}}|$WIDGETS_PROVISIONING_PROFILE_NAME|g" "$EXPORT_OPTIONS"
          sed -i '' "s|{{MAC_PROVISIONING_PROFILE_NAME}}|$MAC_PROVISIONING_PROFILE_NAME|g" "$EXPORT_OPTIONS"

      # CURRENT_PROJECT_VERSION is set on the command line so all targets share the run number as
      # build number, on iOS and macOS alike. PROFILE_<target> picks each target's profile; on
      # macOS only the Breathia target is built.
      - name: Build, Sign and Archive
        env:
          PLATFORM: ${{ matrix.platform }}
          DESTINATION: ${{ matrix.destination }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          WATCH_PROVISIONING_PROFILE_NAME: ${{ secrets.WATCH_PROVISIONING_PROFILE_NAME }}
          WIDGETS_PROVISIONING_PROFILE_NAME: ${{ secrets.WIDGETS_PROVISIONING_PROFILE_NAME }}
          MAC_PROVISIONING_PROFILE_NAME: ${{ secrets.MAC_PROVISIONING_PROFILE_NAME }}
        run: |
          if [ "$PLATFORM" = "iOS" ]; then
            APP_PROFILE_NAME=$PROVISIONING_PROFILE_NAME
          else
            APP_PROFILE_NAME=$MAC_PROVISIONING_PROFILE_NAME
          fi

          echo "Build number: ${{ github.run_number }}"
          set -o pipefail && xcodebuild clean archive \
            -project Breathia.xcodeproj \
            -scheme "Breathia" \
            -archivePath $RUNNER_TEMP/Breathia.xcarchive \
            -configuration Release \
            -destination "$DESTINATION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROFILE_Breathia="$APP_PROFILE_NAME" \
            PROFILE_BreathiaWatch="$WATCH_PROVISIONING_PROFILE_NAME" \
            PROFILE_BreathiaWidgets="$WIDGETS_PROVISIONING_PROFILE_NAME" \
            'PROVISIONING_PROFILE_SPECIFIER=$(PROFILE_$(TARGET_NAME))' | xcbeautify

      - name: Export archive
        run: |
          set -o pipefail && xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Breathia.xcarchive \
            -exportOptionsPlist ${{ matrix.export_options }} \
            -exportPath $RUNNER_TEMP | xcbeautify

      - name: Upload Build Artifact to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f ${{ runner.temp }}/${{ matrix.package }} \
            -t ${{ matrix.altool_type }} \
            --apiKey ${{ secrets.API_KEY_ID }} \
            --apiIssuer ${{ secrets.API_KEY_ISSUER_ID }}

      - name: Clean up keychain, provisioning profiles and API key
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/breathia*.mobileprovision
          rm -f ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/breathia*.provisionprofile
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/breathia*.mobileprovision
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/breathia*.provisionprofile
          rm -rf "$RUNNER_TEMP/private_keys"
